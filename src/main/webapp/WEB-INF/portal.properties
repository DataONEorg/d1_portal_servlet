annotator.consumerKey=theconsumerkey

## cn.server.publiccert.filename can contain multiple cert paths, separated by semicolons
cn.server.publiccert.filename=PUBLIC_CERT_PATH
cn.server.privatekey.filename=PRIVATE_KEY_PATH
## override default of 18 hours here
#token.ttl=64800

## Hosts that /oauth and /logout may redirect browsers back to (the "target" parameter).
## Comma-separated host suffixes: an entry matches that host and its subdomains.
## Targets must be https. If this is empty, any https host is allowed (logged as a warning).
## TODO: review this list against all MetacatUI deployments that use CN login before release.
portal.redirect.allowlist=dataone.org, arcticdata.io, knb.ecoinformatics.org, ess-dive.lbl.gov

## ORCID OAuth properties
orcid.authorization.location=https://orcid.org/oauth/authorize
orcid.token.location=https://orcid.org/oauth/token
orcid.client.id=APP-B630AM0N32QNF6ST
orcid.client.secret=
orcid.prefix=http://orcid.org/

