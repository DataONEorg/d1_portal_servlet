## Keycloak OpenID Connect login (/portal/login, /portal/authorize, /portal/refresh) and access
## token exchange (/portal/token). Disabled while neither keycloak.issuer nor
## keycloak.server.metadata.url is set. Set these per deployment.
## Optional: a client_secrets.json in the dataone-auth format (client_id, client_secret,
## server_metadata_url). The settings below take precedence over values in the file.
#keycloak.client.secrets.file=/etc/dataone/portal/client_secrets.json
## The issuer URL of the Keycloak realm, or its .well-known/openid-configuration URL
#keycloak.issuer=https://auth.dataone.org/realms/dataone
#keycloak.server.metadata.url=https://auth.dataone.org/realms/dataone/.well-known/openid-configuration
## The confidential client the portal logs in with, and its secret
#keycloak.client.id=d1-confidential
#keycloak.client.secret=
## This deployment's login callback: it must reach this portal's /authorize and be registered
## as a redirect URI on the Keycloak client
#keycloak.redirect.uri=https://cn.dataone.org/portal/authorize
## Base scopes requested at login
#keycloak.scope.base=openid profile email
## Extra scopes this deployment always requests at login (a login can ask for more with its scope
## parameter; Keycloak decides which exist and which a user may have)
#keycloak.scope.extra=
## Token claim holding the DataONE subject (the realm's profile scope adds the ORCID iD as orcid)
#keycloak.subject.claim=orcid
## Clients whose access tokens may be exchanged for a DataONE JWT (comma separated; defaults to
## keycloak.client.id). A token's aud must include one, and its azp, if present, must be one.
#keycloak.token.exchange.audiences=d1-confidential
## Scope an access token must carry to be exchanged for a DataONE JWT (empty turns the check off)
#keycloak.token.exchange.scope=dataone:token-exchange
## Register Keycloak users with the CN on login if they aren't registered yet
#keycloak.register.accounts=true
