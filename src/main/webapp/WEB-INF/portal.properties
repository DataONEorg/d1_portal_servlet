## Keycloak OpenID Connect login (/portal/oidc) and access token exchange (/portal/token).
## Disabled while keycloak.issuer is empty. Set these per deployment.
## The issuer URL of the Keycloak realm
#keycloak.issuer=https://auth.dataone.org/realms/dataone
## The confidential client the portal logs in with, and its secret
#keycloak.client.id=d1-confidential
#keycloak.client.secret=
## This deployment's login callback: it must reach this portal's /oidc servlet and be registered
## as a redirect URI on the Keycloak client
#keycloak.redirect.uri=https://cn.dataone.org/portal/oidc
## Scopes requested at login
#keycloak.scope=openid profile email
## Token claim holding the DataONE subject (the realm fills preferred_username with the ORCID iD)
#keycloak.subject.claim=preferred_username
## Audiences a Keycloak access token must carry to be exchanged for a DataONE JWT
## (comma separated; defaults to keycloak.client.id)
#keycloak.token.exchange.audiences=d1-confidential
## Register Keycloak users with the CN on login if they aren't registered yet
#keycloak.register.accounts=true
