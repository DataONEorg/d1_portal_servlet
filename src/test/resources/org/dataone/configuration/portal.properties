## Unit test configuration. No real credentials belong here.

## JWT signing for TokenGenerator: a self-signed 100-year test cert and key (copied from d1_portal)
annotator.consumerKey=theconsumerkey
# cn.server.publiccert.filename can contain multiple cert paths, separated by semicolons
cn.server.publiccert.filename=src/test/resources/org/dataone/portal/unitTestSelfSignedCert.pem
cn.server.privatekey.filename=src/test/resources/org/dataone/portal/unitTestSelfSignedCert.pem

## ORCID OAuth properties (dummy values)
orcid.authorization.location=https://sandbox.orcid.org/oauth/authorize
orcid.token.location=https://api.sandbox.orcid.org/oauth/token
orcid.client.id=APP-TEST-CLIENT-ID
orcid.client.secret=test-client-secret
orcid.prefix=http://orcid.org/
